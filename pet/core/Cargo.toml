[package]
name = "pet-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
getrandom = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
